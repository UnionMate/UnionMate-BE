server:
  port: 8080
spring:
  application:
    name: backend-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/unionmate}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: update

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

server-uri: http://localhost:8000

jwt:
  access:
    secret: YmJhZHNmZHNhZ2dmYWRiYXNkZmFiYmFkc2Zkc2FnZ2ZhZGJhc2RmYWJiYWRzZmRzYWdnZmFkYmFzZGZh
    validity: ${JWT_ACCESS_VALIDITY:86400000}
  refresh:
    secret: YmJhZHNmZHNhZ2dmYWRiYXNkZmFiYmFkc2Zkc2FnZ2ZhZGJhc2RmYWJiYWRzZmRzYWdnZmFkYmFzZGZh
    validity: ${JWT_REFRESH_VALIDITY:604800000}

kafka:
  bootstrap-servers: 134.185.114.241:29092
  topics:
    jwt-verify-request: cert.jwt.id
    jwt-verify-reply: cert.jwt.id.replies
    jwt-generate-request: cert.jwt.generate
    jwt-generate-reply: cert.jwt.replies
    mail-request-result: mail.request.result
  timeout-ms: 5000
  consumer:
    group-id: backend-auth-consumer-local
  producer:
    acks: all
    retries: 3

