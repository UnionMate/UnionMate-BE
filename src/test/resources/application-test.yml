spring:
  datasource:
    url: jdbc:h2:mem:um;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

cert-server-uri: https://gp-cert-service.soyesenna.com
server-uri: http://localhost

jwt:
  access:
    secret: YmJhZHNmZHNhZ2dmYWRiYXNkZmFiYmFkc2Zkc2FnZ2ZhZGJhc2RmYWJiYWRzZmRzYWdnZmFkYmFzZGZh
    validity: ${JWT_ACCESS_VALIDITY:86400000}
  refresh:
    secret: YmJhZHNmZHNhZ2dmYWRiYXNkZmFiYmFkc2Zkc2FnZ2ZhZGJhc2RmYWJiYWRzZmRzYWdnZmFkYmFzZGZh
    validity: ${JWT_REFRESH_VALIDITY:604800000}

kafka:
  bootstrap-servers: 134.185.114.241:29092
  topics:
    jwt-verify-request: cert.jwt.id
    jwt-verify-reply: cert.jwt.id.replies
    jwt-generate-request: cert.jwt.generate
    jwt-generate-reply: cert.jwt.replies
    mail-request-result: mail.request.result
  timeout-ms: 5000
  consumer:
    group-id: backend-auth-consumer-local
  producer:
    acks: all
    retries: 3

